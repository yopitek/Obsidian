<template id="scene4-usecases-template">
  <div
    data-composition-id="scene4-usecases"
    data-width="1920"
    data-height="1080"
    data-duration="6"
  >
    <div class="canvas">
      <!-- Scene headline -->
      <div class="scene-headline">WORKS WITH YOUR SETUP</div>

      <!-- Use case cards -->
      <div class="usecase-card uc1">
        <div class="uc-icon">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <!-- Router icon -->
            <rect x="10" y="30" width="60" height="35" rx="6" fill="none" stroke="#0066FF" stroke-width="3"/>
            <circle cx="25" cy="47" r="4" fill="#0066FF"/>
            <circle cx="40" cy="47" r="4" fill="#0066FF" opacity="0.6"/>
            <circle cx="55" cy="47" r="4" fill="#0066FF" opacity="0.3"/>
            <path d="M 30 28 Q 40 14 50 28" fill="none" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 22 26 Q 40 6 58 26" fill="none" stroke="#0066FF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
          </svg>
        </div>
        <div class="uc-title">Router Upgrade</div>
        <div class="uc-desc">Replace stock antenna on any RP-SMA router for stronger directional coverage</div>
      </div>

      <div class="usecase-card uc2">
        <div class="uc-icon">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <!-- Drone icon -->
            <rect x="32" y="34" width="16" height="12" rx="3" fill="none" stroke="#0066FF" stroke-width="3"/>
            <!-- Drone arms -->
            <line x1="32" y1="36" x2="16" y2="24" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="48" y1="36" x2="64" y2="24" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="32" y1="44" x2="16" y2="56" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="48" y1="44" x2="64" y2="56" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Propellers -->
            <ellipse cx="16" cy="22" rx="12" ry="4" fill="none" stroke="#0066FF" stroke-width="2" opacity="0.7"/>
            <ellipse cx="64" cy="22" rx="12" ry="4" fill="none" stroke="#0066FF" stroke-width="2" opacity="0.7"/>
            <ellipse cx="16" cy="58" rx="12" ry="4" fill="none" stroke="#0066FF" stroke-width="2" opacity="0.7"/>
            <ellipse cx="64" cy="58" rx="12" ry="4" fill="none" stroke="#0066FF" stroke-width="2" opacity="0.7"/>
          </svg>
        </div>
        <div class="uc-title">Drone Range</div>
        <div class="uc-desc">Extends control range on DJI Phantom 3, 3DR Solo &amp; Yuneec Typhoon H</div>
      </div>

      <div class="usecase-card uc3">
        <div class="uc-icon">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <!-- USB adapter icon -->
            <rect x="22" y="28" width="36" height="28" rx="5" fill="none" stroke="#0066FF" stroke-width="3"/>
            <rect x="34" y="56" width="12" height="12" rx="2" fill="none" stroke="#0066FF" stroke-width="2.5"/>
            <rect x="32" y="62" width="16" height="6" rx="1" fill="#0066FF" opacity="0.2"/>
            <!-- USB symbol -->
            <line x1="40" y1="34" x2="40" y2="48" stroke="#0066FF" stroke-width="2"/>
            <circle cx="40" cy="34" r="3" fill="#0066FF"/>
            <path d="M 33 43 L 40 48 L 47 43" fill="none" stroke="#0066FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="uc-title">USB Adapter</div>
        <div class="uc-desc">Pairs perfectly with ALFA USB Wi-Fi adapters for long-range laptop connectivity</div>
      </div>

      <!-- Connector badge -->
      <div class="connector-badge">
        <span class="badge-icon">⚡</span>
        <span class="badge-text">RP-SMA Screw-On — Tool-free install in seconds</span>
      </div>
    </div>

    <style>
      [data-composition-id="scene4-usecases"] .canvas {
        width: 1920px;
        height: 1080px;
        background: #050508;
        position: relative;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      [data-composition-id="scene4-usecases"] .scene-headline {
        position: absolute;
        top: 100px;
        left: 0; right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 600;
        color: #0066FF;
        letter-spacing: 0.3em;
        opacity: 0;
      }

      [data-composition-id="scene4-usecases"] .usecase-card {
        position: absolute;
        top: 260px;
        width: 480px;
        padding: 48px 40px;
        background: rgba(10, 10, 31, 0.95);
        border: 1px solid rgba(0, 102, 255, 0.25);
        border-top: 3px solid #0066FF;
        border-radius: 16px;
        opacity: 0;
        transform: translateY(50px);
      }

      [data-composition-id="scene4-usecases"] .uc1 { left: 180px; }
      [data-composition-id="scene4-usecases"] .uc2 { left: 720px; }
      [data-composition-id="scene4-usecases"] .uc3 { right: 180px; }

      [data-composition-id="scene4-usecases"] .uc-icon {
        margin-bottom: 24px;
        opacity: 0;
        transform: scale(0.8);
      }

      [data-composition-id="scene4-usecases"] .uc-title {
        font-size: 42px;
        font-weight: 800;
        color: white;
        letter-spacing: -0.02em;
        margin-bottom: 16px;
      }

      [data-composition-id="scene4-usecases"] .uc-desc {
        font-size: 22px;
        font-weight: 400;
        color: rgba(255,255,255,0.55);
        line-height: 1.5;
      }

      [data-composition-id="scene4-usecases"] .connector-badge {
        position: absolute;
        bottom: 120px;
        left: 0; right: 0;
        text-align: center;
        opacity: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      [data-composition-id="scene4-usecases"] .badge-icon {
        font-size: 28px;
      }

      [data-composition-id="scene4-usecases"] .badge-text {
        font-size: 28px;
        font-weight: 500;
        color: rgba(255,255,255,0.6);
        letter-spacing: 0.02em;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const headline = document.querySelector(".scene-headline");
        const cards = document.querySelectorAll(".usecase-card");
        const icons = document.querySelectorAll(".uc-icon");
        const badge = document.querySelector(".connector-badge");

        // Headline
        tl.to(headline, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

        // Cards slide up one by one
        cards.forEach((card, i) => {
          tl.to(card, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.3)" }, 0.3 + i * 0.25);
        });

        // Icons pop in
        icons.forEach((icon, i) => {
          tl.to(icon, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.6 + i * 0.25);
        });

        // Badge slides up
        tl.to(badge, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.2);

        // Subtle highlight pulse on card 1
        tl.to(cards[0], { borderColor: "rgba(0,102,255,0.7)", duration: 0.3, ease: "power2.out" }, 3.5);
        tl.to(cards[0], { borderColor: "rgba(0,102,255,0.25)", duration: 0.4, ease: "power2.in" }, 3.8);

        // Exit
        tl.to(Array.from(cards), { opacity: 0, y: -20, duration: 0.3, stagger: 0.06, ease: "power2.in" }, 5.3);
        tl.to([headline, badge], { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene4-usecases"] = tl;
      })();
    </script>
  </div>
</template>

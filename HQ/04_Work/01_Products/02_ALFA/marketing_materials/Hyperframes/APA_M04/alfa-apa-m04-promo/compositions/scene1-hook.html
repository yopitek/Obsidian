<template id="scene1-hook-template">
  <div
    data-composition-id="scene1-hook"
    data-width="1920"
    data-height="1080"
    data-duration="5"
  >
    <div class="canvas">
      <!-- Background grid -->
      <svg class="bg-grid" viewBox="0 0 1920 1080" width="1920" height="1080">
        <defs>
          <pattern id="grid1" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid1)"/>
      </svg>

      <!-- WiFi bars (weak signal) -->
      <div class="wifi-container">
        <svg class="wifi-svg" viewBox="0 0 240 200" width="240" height="200">
          <!-- Bar 1 (smallest) -->
          <rect class="bar bar1" x="20" y="140" width="36" height="40" rx="4" fill="#0066FF"/>
          <!-- Bar 2 -->
          <rect class="bar bar2" x="72" y="100" width="36" height="80" rx="4" fill="#0066FF"/>
          <!-- Bar 3 -->
          <rect class="bar bar3" x="124" y="60" width="36" height="120" rx="4" fill="#0066FF"/>
          <!-- Bar 4 (tallest) -->
          <rect class="bar bar4" x="176" y="20" width="36" height="160" rx="4" fill="#0066FF"/>
          <!-- X mark overlay -->
          <g class="x-mark">
            <line x1="90" y1="10" x2="150" y2="70" stroke="#FF3A3A" stroke-width="8" stroke-linecap="round"/>
            <line x1="150" y1="10" x2="90" y2="70" stroke="#FF3A3A" stroke-width="8" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <!-- Headline -->
      <div class="headline-wrap">
        <div class="headline-line1">YOUR WI-FI IS</div>
        <div class="headline-line2">LOSING THE BATTLE</div>
      </div>

      <!-- Sub text -->
      <div class="subtext">Weak signal. Dead zones. Frustrated users.</div>

      <!-- Scan line effect -->
      <div class="scan-line"></div>
    </div>

    <style>
      [data-composition-id="scene1-hook"] .canvas {
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at center, #0a0a1a 0%, #050508 70%);
        position: relative;
        overflow: hidden;
      }

      [data-composition-id="scene1-hook"] .bg-grid {
        position: absolute;
        top: 0; left: 0;
        opacity: 0.6;
      }

      [data-composition-id="scene1-hook"] .wifi-container {
        position: absolute;
        left: 840px;
        top: 260px;
        opacity: 0;
      }

      [data-composition-id="scene1-hook"] .bar {
        opacity: 0.3;
        transform-origin: bottom center;
      }

      [data-composition-id="scene1-hook"] .x-mark {
        opacity: 0;
      }

      [data-composition-id="scene1-hook"] .headline-wrap {
        position: absolute;
        top: 540px;
        left: 0; right: 0;
        text-align: center;
        overflow: hidden;
      }

      [data-composition-id="scene1-hook"] .headline-line1,
      [data-composition-id="scene1-hook"] .headline-line2 {
        font-size: 100px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: white;
        line-height: 1.05;
        opacity: 0;
        transform: translateY(40px);
      }

      [data-composition-id="scene1-hook"] .headline-line2 {
        color: #FF3A3A;
      }

      [data-composition-id="scene1-hook"] .subtext {
        position: absolute;
        bottom: 180px;
        left: 0; right: 0;
        text-align: center;
        font-size: 36px;
        font-weight: 400;
        color: rgba(255,255,255,0.5);
        opacity: 0;
        letter-spacing: 0.04em;
      }

      [data-composition-id="scene1-hook"] .scan-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(0,102,255,0.6), transparent);
        top: -2px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const bars = document.querySelectorAll(".bar");
        const xMark = document.querySelector(".x-mark");
        const wifi = document.querySelector(".wifi-container");
        const line1 = document.querySelector(".headline-line1");
        const line2 = document.querySelector(".headline-line2");
        const subtext = document.querySelector(".subtext");
        const scanLine = document.querySelector(".scan-line");

        // Scan line sweeps down
        tl.fromTo(scanLine, { top: -2 }, { top: 1082, duration: 1.5, ease: "none" }, 0);

        // WiFi icon fades in
        tl.to(wifi, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);

        // Bars flicker weakly (only bars 1 & 2 active, 3 & 4 dim)
        tl.to([bars[0], bars[1]], { opacity: 0.9, duration: 0.3, stagger: 0.08, ease: "power2.out" }, 0.3);
        tl.to([bars[2], bars[3]], { opacity: 0.1, duration: 0.3, stagger: 0.08 }, 0.3);

        // Flicker effect on bar 2
        tl.to(bars[1], { opacity: 0.2, duration: 0.1 }, 1.0);
        tl.to(bars[1], { opacity: 0.9, duration: 0.1 }, 1.1);
        tl.to(bars[1], { opacity: 0.1, duration: 0.15 }, 1.5);
        tl.to(bars[1], { opacity: 0.8, duration: 0.1 }, 1.7);

        // Bar 1 also flickers
        tl.to(bars[0], { opacity: 0.2, duration: 0.12 }, 1.2);
        tl.to(bars[0], { opacity: 0.9, duration: 0.12 }, 1.35);

        // X mark appears at t=1.8
        tl.to(xMark, { opacity: 1, duration: 0.2, ease: "power3.out" }, 1.8);

        // Headline appears
        tl.to(line1, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.2);
        tl.to(line2, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.5);

        // Subtext fades in
        tl.to(subtext, { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.2);

        // Pulse the whole wifi icon once
        tl.to(wifi, { scale: 1.05, duration: 0.15, ease: "power2.out" }, 2.5);
        tl.to(wifi, { scale: 1.0, duration: 0.15, ease: "power2.in" }, 2.65);

        // Scene exit: everything dims
        tl.to([wifi, line1, line2, subtext], { opacity: 0, duration: 0.3, stagger: 0.05, ease: "power2.in" }, 4.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-hook"] = tl;
      })();
    </script>
  </div>
</template>

<template id="scene1-hook-template">
  <div
    data-composition-id="scene1-hook"
    data-width="1920"
    data-height="1080"
    data-duration="5"
  >
    <div class="canvas">
      <!-- Background grid -->
      <svg class="bg-grid" viewBox="0 0 1920 1080" width="1920" height="1080">
        <defs>
          <pattern id="grid1" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid1)"/>
      </svg>

      <!-- Scattered signal icon: multiple arrows pointing in all directions -->
      <div class="scatter-container">
        <svg class="scatter-svg" viewBox="0 0 280 280" width="280" height="280">
          <!-- Center dot -->
          <circle class="center-dot" cx="140" cy="140" r="12" fill="#0066FF"/>
          <!-- Arrows scattered in 8 directions -->
          <g class="arrow a0">
            <line x1="140" y1="140" x2="140" y2="60" stroke="#FF3A3A" stroke-width="4" stroke-linecap="round"/>
            <polygon points="140,48 131,68 149,68" fill="#FF3A3A"/>
          </g>
          <g class="arrow a1">
            <line x1="140" y1="140" x2="200" y2="80" stroke="#FF3A3A" stroke-width="4" stroke-linecap="round"/>
            <polygon points="208,72 192,82 202,98" fill="#FF3A3A"/>
          </g>
          <g class="arrow a2">
            <line x1="140" y1="140" x2="220" y2="140" stroke="#FF3A3A" stroke-width="4" stroke-linecap="round"/>
            <polygon points="232,140 212,131 212,149" fill="#FF3A3A"/>
          </g>
          <g class="arrow a3">
            <line x1="140" y1="140" x2="200" y2="200" stroke="#FF3A3A" stroke-width="3" stroke-linecap="round"/>
            <polygon points="208,208 192,198 202,182" fill="#FF3A3A"/>
          </g>
          <g class="arrow a4">
            <line x1="140" y1="140" x2="140" y2="220" stroke="#FF3A3A" stroke-width="3" stroke-linecap="round"/>
            <polygon points="140,232 131,212 149,212" fill="#FF3A3A"/>
          </g>
          <g class="arrow a5">
            <line x1="140" y1="140" x2="80" y2="200" stroke="#FF3A3A" stroke-width="3" stroke-linecap="round"/>
            <polygon points="72,208 78,188 98,198" fill="#FF3A3A"/>
          </g>
          <g class="arrow a6">
            <line x1="140" y1="140" x2="60" y2="140" stroke="#FF3A3A" stroke-width="4" stroke-linecap="round"/>
            <polygon points="48,140 68,131 68,149" fill="#FF3A3A"/>
          </g>
          <g class="arrow a7">
            <line x1="140" y1="140" x2="80" y2="80" stroke="#FF3A3A" stroke-width="4" stroke-linecap="round"/>
            <polygon points="72,72 88,82 78,98" fill="#FF3A3A"/>
          </g>
        </svg>
      </div>

      <!-- Headline -->
      <div class="headline-wrap">
        <div class="headline-line1">YOUR SIGNAL IS</div>
        <div class="headline-line2">GOING EVERYWHERE</div>
      </div>

      <!-- Sub text -->
      <div class="subtext">Scattered. Unfocused. Losing half its power to thin air.</div>

      <!-- Scan line effect -->
      <div class="scan-line"></div>
    </div>

    <style>
      [data-composition-id="scene1-hook"] .canvas {
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at center, #0a0a1a 0%, #050508 70%);
        position: relative;
        overflow: hidden;
      }

      [data-composition-id="scene1-hook"] .bg-grid {
        position: absolute;
        top: 0; left: 0;
        opacity: 0.6;
      }

      [data-composition-id="scene1-hook"] .scatter-container {
        position: absolute;
        left: 820px;
        top: 240px;
        opacity: 0;
      }

      [data-composition-id="scene1-hook"] .center-dot {
        opacity: 0;
      }

      [data-composition-id="scene1-hook"] .arrow {
        opacity: 0;
      }

      [data-composition-id="scene1-hook"] .headline-wrap {
        position: absolute;
        top: 560px;
        left: 0; right: 0;
        text-align: center;
        overflow: hidden;
      }

      [data-composition-id="scene1-hook"] .headline-line1,
      [data-composition-id="scene1-hook"] .headline-line2 {
        font-size: 100px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: white;
        line-height: 1.05;
        opacity: 0;
        transform: translateY(40px);
      }

      [data-composition-id="scene1-hook"] .headline-line2 {
        color: #FF3A3A;
      }

      [data-composition-id="scene1-hook"] .subtext {
        position: absolute;
        bottom: 160px;
        left: 0; right: 0;
        text-align: center;
        font-size: 34px;
        font-weight: 400;
        color: rgba(255,255,255,0.5);
        opacity: 0;
        letter-spacing: 0.03em;
      }

      [data-composition-id="scene1-hook"] .scan-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(0,102,255,0.6), transparent);
        top: -2px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const scatter = document.querySelector(".scatter-container");
        const centerDot = document.querySelector(".center-dot");
        const arrows = document.querySelectorAll(".arrow");
        const line1 = document.querySelector(".headline-line1");
        const line2 = document.querySelector(".headline-line2");
        const subtext = document.querySelector(".subtext");
        const scanLine = document.querySelector(".scan-line");

        // Scan line sweeps down
        tl.fromTo(scanLine, { top: -2 }, { top: 1082, duration: 1.5, ease: "none" }, 0);

        // Scatter container fades in
        tl.to(scatter, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);

        // Center dot pulses in
        tl.to(centerDot, { opacity: 1, scale: 1.3, duration: 0.3, ease: "back.out(2)" }, 0.3);
        tl.to(centerDot, { scale: 1.0, duration: 0.2, ease: "power2.in" }, 0.6);

        // Arrows shoot out one by one (chaotic scatter)
        const arrowDelays = [0.5, 0.6, 0.55, 0.7, 0.65, 0.75, 0.58, 0.68];
        arrows.forEach(function(arrow, i) {
          tl.fromTo(arrow, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, arrowDelays[i]);
        });

        // Arrows flicker chaotically
        tl.to(arrows[0], { opacity: 0.2, duration: 0.1 }, 1.2);
        tl.to(arrows[0], { opacity: 1, duration: 0.1 }, 1.35);
        tl.to(arrows[3], { opacity: 0.3, duration: 0.12 }, 1.5);
        tl.to(arrows[3], { opacity: 1, duration: 0.1 }, 1.65);
        tl.to(arrows[6], { opacity: 0.2, duration: 0.1 }, 1.8);
        tl.to(arrows[6], { opacity: 1, duration: 0.12 }, 1.95);

        // Headline slams in
        tl.to(line1, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.1);
        tl.to(line2, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.4);

        // Subtext fades in
        tl.to(subtext, { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.1);

        // Scatter pulses once
        tl.to(scatter, { scale: 1.05, duration: 0.15, ease: "power2.out" }, 2.8);
        tl.to(scatter, { scale: 1.0, duration: 0.15, ease: "power2.in" }, 2.95);

        // Exit
        tl.to([scatter, line1, line2, subtext], { opacity: 0, duration: 0.3, stagger: 0.05, ease: "power2.in" }, 4.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-hook"] = tl;
      })();
    </script>
  </div>
</template>
